[project]
name = "comunicacao-proativa"
version = "0.1.0"
description = "Comunicação proativa com segurados baseada em eventos meteorológicos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "flask>=3.1.0",
    "httpx>=0.28.0",
    "langgraph>=0.6.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pyright>=1.1.400",
    "ruff>=0.12.0",
]

[project.scripts]
comunicacao-proativa = "comunicacao_proativa.comandos:principal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comunicacao_proativa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "main.py"]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
